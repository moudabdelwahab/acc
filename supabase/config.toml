# إعدادات Supabase CLI لهذا المستودع
# project_id هو مرجع المشروع (project ref) على Supabase.
project_id = "lxbqalqibudovewwenes"

[db]
port = 54322
major_version = 17

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[studio]
enabled = true
port = 54323
