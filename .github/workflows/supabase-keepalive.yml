name: Supabase Keep-Alive

# يرسل استعلاماً خفيفاً إلى قاعدة البيانات كل ساعة حتى لا يُوقَف
# مشروع Supabase المجاني بسبب عدم النشاط.
#
# الاستعلام يمرّ عبر REST API بالمفتاح العام (publishable) المقروء من
# js/config.js، فلا يحتاج أي أسرار. RLS تُرجع للمفتاح العام مصفوفة فارغة،
# لكن الاستعلام يُنفَّذ فعلاً داخل Postgres وهذا ما يُحتسب نشاطاً.
#
# ملاحظة: الجدولة (schedule) لا تعمل إلا من الفرع الافتراضي (main).
on:
  schedule:
    - cron: '7 * * * *'   # كل ساعة عند الدقيقة 7 (UTC)
  workflow_dispatch:

concurrency:
  group: supabase-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: js/config.js
          sparse-checkout-cone-mode: false

      - name: Query database
        run: |
          URL=$(grep -oE "SUPABASE_URL:[[:space:]]*'[^']+'" js/config.js | cut -d"'" -f2)
          KEY=$(grep -oE "SUPABASE_ANON_KEY:[[:space:]]*'[^']+'" js/config.js | cut -d"'" -f2)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::تعذّر قراءة SUPABASE_URL أو SUPABASE_ANON_KEY من js/config.js"
            exit 1
          fi

          for attempt in 1 2 3; do
            STATUS=$(curl -sS -o response.json -w '%{http_code}' --max-time 30 \
              "$URL/rest/v1/company_settings?select=id&limit=1" \
              -H "apikey: $KEY") || STATUS=000
            echo "المحاولة $attempt: HTTP $STATUS"
            if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
              echo "تم تنفيذ الاستعلام بنجاح."
              exit 0
            fi
            cat response.json 2>/dev/null || true
            sleep $((attempt * 10))
          done

          echo "::error::فشل الاستعلام بعد 3 محاولات (آخر حالة HTTP $STATUS)"
          exit 1
